<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Starosta.uz — Admin panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>body{font-family:'Inter',system-ui,sans-serif}</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

<!-- KIRISH -->
<div id="login" class="hidden min-h-screen flex items-center justify-center p-4">
  <form id="login-form" class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-8 space-y-4">
    <div class="text-center">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-slate-900 text-white flex items-center justify-center text-2xl"><i class="ph-fill ph-shield-check"></i></div>
      <h1 class="mt-3 text-xl font-bold">Admin panel</h1>
      <p class="text-sm text-slate-500">Starosta.uz boshqaruvi</p>
    </div>
    <input id="l-user" autocomplete="username" required placeholder="Login" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800" />
    <input id="l-pass" type="password" autocomplete="current-password" required placeholder="Parol" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800" />
    <p id="l-err" class="hidden text-xs font-medium text-rose-600"></p>
    <button class="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-700 text-white text-sm font-semibold">Kirish</button>
  </form>
</div>

<!-- ASOSIY -->
<div id="app" class="hidden">
  <header class="bg-slate-900 text-white">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 font-bold"><i class="ph-fill ph-shield-check text-xl"></i> Starosta.uz <span class="text-slate-400 font-medium">/ Admin</span></div>
      <div class="flex items-center gap-2">
        <button onclick="refresh()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium"><i class="ph ph-arrows-clockwise"></i> Yangilash</button>
        <button onclick="logout()" class="px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-xs font-semibold">Chiqish</button>
      </div>
    </div>
    <nav class="max-w-7xl mx-auto px-4 flex gap-1 overflow-x-auto" id="tabs"></nav>
  </header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
    <section id="tab-dashboard" class="tab space-y-6"></section>
    <section id="tab-devices" class="tab hidden"></section>
    <section id="tab-users" class="tab hidden"></section>
    <section id="tab-groups" class="tab hidden"></section>
    <section id="tab-telegram" class="tab hidden space-y-6"></section>
  </main>
</div>

<div id="toast" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

<script>
const TABS = [['dashboard','Statistika','ph-chart-bar'],['devices','Qurilmalar','ph-devices'],['users','Foydalanuvchilar','ph-users'],['groups','Guruhlar','ph-student'],['telegram','Telegram','ph-telegram-logo']];
let current = 'dashboard';
let charts = {};

// XSS dan himoya: foydalanuvchi kiritgan har qanday matn esc() orqali chiqariladi
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (id) => document.getElementById(id);

function toast(msg, ok = true) {
  const el = document.createElement('div');
  el.className = `px-4 py-2.5 rounded-xl text-sm font-medium shadow-lg text-white ${ok ? 'bg-slate-900' : 'bg-rose-600'}`;
  el.textContent = msg; $('toast').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

async function api(path, opts = {}) {
  const o = { credentials: 'same-origin', ...opts, headers: { ...(opts.headers || {}) } };
  if (o.body !== undefined && typeof o.body !== 'string') { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(o.body); }
  const res = await fetch('/api/admin' + path, o);
  let data = null; try { data = await res.json(); } catch (_) {}
  if (res.status === 401 && path !== '/login') { showLogin(); throw new Error('Sessiya tugadi'); }
  if (!res.ok) throw new Error((data && data.error) || `Xatolik (${res.status})`);
  return data;
}

const fmtDT = (v) => v ? new Date(v).toLocaleString('uz-UZ', { dateStyle: 'short', timeStyle: 'short' }) : '—';
function ago(ms) {
  if (!ms) return '—';
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return 'hozirgina';
  if (s < 3600) return `${Math.floor(s / 60)} daq. oldin`;
  if (s < 86400) return `${Math.floor(s / 3600)} soat oldin`;
  return `${Math.floor(s / 86400)} kun oldin`;
}
const card = (icon, label, value, sub = '', color = 'text-slate-900') => `
  <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/70">
    <div class="flex items-center gap-2 text-xs font-medium text-slate-500"><i class="ph ${icon} text-base"></i>${label}</div>
    <div class="mt-1 text-2xl font-bold ${color}">${value}</div>
    <div class="text-[11px] text-slate-400">${sub}</div>
  </div>`;
const th = (...c) => `<thead class="bg-slate-50 text-xs text-slate-500"><tr>${c.map(x => `<th class="text-left font-semibold px-4 py-2.5 whitespace-nowrap">${x}</th>`).join('')}</tr></thead>`;
const tableWrap = (inner) => `<div class="bg-white rounded-2xl shadow-sm border border-slate-200/70 overflow-x-auto"><table class="w-full text-sm">${inner}</table></div>`;

// ---------- Kirish / chiqish ----------
function showLogin() { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }
function showApp() { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); renderTabs(); refresh(); }

$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault(); $('l-err').classList.add('hidden');
  try {
    await api('/login', { method: 'POST', body: { username: $('l-user').value, password: $('l-pass').value } });
    $('l-pass').value = ''; showApp();
  } catch (err) { $('l-err').textContent = err.message; $('l-err').classList.remove('hidden'); }
});
async function logout() { try { await api('/logout', { method: 'POST' }); } catch (_) {} location.reload(); }

function renderTabs() {
  $('tabs').innerHTML = TABS.map(([id, label, icon]) => `
    <button onclick="switchTab('${id}')" data-tab="${id}" class="tab-btn flex items-center gap-1.5 px-3.5 py-2.5 text-sm font-medium whitespace-nowrap border-b-2 ${id === current ? 'border-white text-white' : 'border-transparent text-slate-400 hover:text-white'}">
      <i class="ph ${icon}"></i>${label}</button>`).join('');
}
function switchTab(id) {
  current = id; renderTabs();
  document.querySelectorAll('.tab').forEach(s => s.classList.add('hidden'));
  $('tab-' + id).classList.remove('hidden'); refresh();
}
function refresh() {
  ({ dashboard: loadDashboard, devices: loadDevices, users: loadUsers, groups: loadGroups, telegram: loadTelegram })[current]()
    .catch(e => toast(e.message, false));
}

// ---------- Statistika ----------
function chart(id, cfg) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart($(id), cfg);
}
async function loadDashboard() {
  const s = await api('/stats');
  const t = s.totals, td = s.today;
  const rate = td.total ? Math.round(100 * (td.total - td.absent) / td.total) : null;
  $('tab-dashboard').innerHTML = `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      ${card('ph-users', 'Foydalanuvchilar', t.users, `shu hafta +${t.users_week}${t.blocked ? ` · ${t.blocked} bloklangan` : ''}`)}
      ${card('ph-broadcast', 'Hozir onlayn', s.devices.online, `${s.devices.total} ta faol qurilma`, 'text-emerald-600')}
      ${card('ph-student', 'Guruhlar', t.groups, `${t.students} ta talaba`)}
      ${card('ph-calendar-check', 'Bugun davomat olingan', td.groups_marked, td.total ? `${td.total} yozuv · kelmagan ${td.absent}` : 'hali yo\'q')}
      ${card('ph-list-checks', 'Jami davomat kunlari', t.sessions, `${t.records} ta yozuv`)}
      ${card('ph-percent', 'Bugungi davomat', rate === null ? '—' : rate + '%', '', rate !== null && rate < 70 ? 'text-rose-600' : 'text-slate-900')}
      ${card('ph-paper-plane-tilt', 'Telegram (7 kun)', s.telegram.enabled ? s.telegram.ok : 'o\'chiq', s.telegram.enabled ? `${s.telegram.failed} ta xato` : 'bot sozlanmagan', 'text-sky-600')}
      ${card('ph-user-plus', 'Yangi (30 kun)', s.signups.reduce((a, r) => a + r.n, 0), 'ro\'yxatdan o\'tganlar')}
    </div>
    <div class="grid lg:grid-cols-3 gap-4">
      <div class="lg:col-span-2 bg-white rounded-2xl p-4 shadow-sm border border-slate-200/70"><h3 class="text-sm font-semibold mb-2">Oxirgi 14 kun</h3><div class="h-64"><canvas id="c-daily"></canvas></div></div>
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/70"><h3 class="text-sm font-semibold mb-2">Holatlar (jami)</h3><div class="h-64"><canvas id="c-status"></canvas></div></div>
    </div>
    <div class="grid lg:grid-cols-2 gap-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/70"><h3 class="text-sm font-semibold mb-2">Yangi foydalanuvchilar (30 kun)</h3><div class="h-52"><canvas id="c-signups"></canvas></div></div>
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/70"><h3 class="text-sm font-semibold mb-2">Eng ko'p kelmaydigan guruhlar</h3>
        ${s.topAbsent.length ? `<ul class="divide-y divide-slate-100 text-sm">${s.topAbsent.map(g => `
          <li class="py-2 flex items-center justify-between gap-3"><div><div class="font-medium">${esc(g.name)}</div><div class="text-xs text-slate-400">${esc(g.owner)}</div></div>
          <div class="text-rose-600 font-semibold">${Math.round(100 * g.absent / g.total)}%</div></li>`).join('')}</ul>` : '<p class="text-sm text-slate-400">Ma\'lumot yo\'q</p>'}
      </div>
    </div>`;
  chart('c-daily', { type: 'bar', data: { labels: s.daily.map(d => d.date.slice(5)), datasets: [
    { label: 'Davomat olgan guruhlar', data: s.daily.map(d => d.groups_marked), backgroundColor: '#6366f1', borderRadius: 4 },
    { label: 'Kelmaganlar', data: s.daily.map(d => d.absent), backgroundColor: '#f43f5e', borderRadius: 4 }] },
    options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } } });
  const L = { present: 'Keldi', late: 'Kechikdi', excused: 'Sababli', absent: 'Kelmadi' };
  chart('c-status', { type: 'doughnut', data: { labels: Object.keys(L).map(k => L[k]), datasets: [{ data: Object.keys(L).map(k => s.statuses[k] || 0), backgroundColor: ['#10b981', '#f59e0b', '#38bdf8', '#f43f5e'] }] },
    options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } } });
  chart('c-signups', { type: 'line', data: { labels: s.signups.map(d => d.date.slice(5)), datasets: [{ label: 'Yangi', data: s.signups.map(d => d.n), borderColor: '#0ea5e9', backgroundColor: '#0ea5e933', fill: true, tension: .3 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } } });
}

// ---------- Qurilmalar ----------
const DEV_ICON = { mobile: 'ph-device-mobile', tablet: 'ph-device-tablet', desktop: 'ph-desktop' };
async function loadDevices() {
  const { devices, online, total } = await api('/devices');
  $('tab-devices').innerHTML = `
    <div class="flex items-center justify-between mb-3"><h2 class="font-semibold">Ulangan qurilmalar <span class="text-slate-400 font-normal">· ${online} onlayn / ${total} faol sessiya</span></h2></div>
    ${devices.length ? tableWrap(th('Holat', 'Foydalanuvchi', 'Qurilma', 'IP', 'Kirgan vaqti', 'Oxirgi faollik', '') + `<tbody class="divide-y divide-slate-100">${devices.map(d => `
      <tr>
        <td class="px-4 py-2.5"><span class="inline-flex items-center gap-1.5 text-xs font-medium ${d.online ? 'text-emerald-600' : 'text-slate-400'}"><span class="w-2 h-2 rounded-full ${d.online ? 'bg-emerald-500' : 'bg-slate-300'}"></span>${d.online ? 'Onlayn' : 'Oflayn'}</span></td>
        <td class="px-4 py-2.5"><div class="font-medium">${esc(d.userName)}</div><div class="text-xs text-slate-400">${esc(d.email)}</div></td>
        <td class="px-4 py-2.5 whitespace-nowrap"><i class="ph ${DEV_ICON[d.type]} mr-1"></i>${esc(d.os)} · ${esc(d.browser)}</td>
        <td class="px-4 py-2.5 font-mono text-xs">${esc(d.ip)}</td>
        <td class="px-4 py-2.5 whitespace-nowrap text-xs">${fmtDT(d.loginAt)}</td>
        <td class="px-4 py-2.5 whitespace-nowrap text-xs">${ago(d.lastSeen)}</td>
        <td class="px-4 py-2.5 text-right"><button onclick="revoke('${esc(d.sid)}')" class="px-2.5 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold">Uzish</button></td>
      </tr>`).join('')}</tbody>`) : '<p class="text-sm text-slate-400">Faol qurilma yo\'q</p>'}
    <p class="mt-3 text-xs text-slate-400">"Onlayn" — oxirgi 5 daqiqada faol bo'lgan qurilma. "Uzish" bosilsa foydalanuvchi shu qurilmadan chiqarib yuboriladi.</p>`;
}
async function revoke(sid) {
  if (!confirm('Bu qurilmani tizimdan uzmoqchimisiz?')) return;
  await api('/devices/' + encodeURIComponent(sid), { method: 'DELETE' }); toast('Qurilma uzildi'); loadDevices();
}

// ---------- Foydalanuvchilar ----------
async function loadUsers() {
  const { users } = await api('/users');
  $('tab-users').innerHTML = `<h2 class="font-semibold mb-3">Foydalanuvchilar (${users.length})</h2>` + tableWrap(th('Foydalanuvchi', 'Guruh', 'Talaba', 'Ro\'yxatdan o\'tgan', 'Oxirgi kirish', 'Holat', '') + `<tbody class="divide-y divide-slate-100">${users.map(u => `
    <tr>
      <td class="px-4 py-2.5"><div class="flex items-center gap-2.5">${u.avatar ? `<img src="${esc(u.avatar)}" referrerpolicy="no-referrer" class="w-8 h-8 rounded-full" alt="">` : '<div class="w-8 h-8 rounded-full bg-slate-200"></div>'}
        <div><div class="font-medium">${esc(u.name)}</div><div class="text-xs text-slate-400">${esc(u.email)}</div></div></div></td>
      <td class="px-4 py-2.5">${u.groups}</td><td class="px-4 py-2.5">${u.students}</td>
      <td class="px-4 py-2.5 text-xs whitespace-nowrap">${fmtDT(u.createdAt)}</td><td class="px-4 py-2.5 text-xs whitespace-nowrap">${fmtDT(u.lastLoginAt)}</td>
      <td class="px-4 py-2.5">${u.blocked ? '<span class="text-xs font-semibold text-rose-600">Bloklangan</span>' : '<span class="text-xs font-semibold text-emerald-600">Faol</span>'}</td>
      <td class="px-4 py-2.5 text-right whitespace-nowrap">
        <button onclick="blockUser('${esc(u.id)}', ${!u.blocked})" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-semibold">${u.blocked ? 'Blokdan chiqarish' : 'Bloklash'}</button>
        <button onclick="deleteUser('${esc(u.id)}')" class="px-2.5 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold">O'chirish</button>
      </td>
    </tr>`).join('')}</tbody>`);
}
async function blockUser(id, blocked) {
  if (blocked && !confirm('Foydalanuvchi bloklanadi va barcha qurilmalardan chiqariladi. Davom etasizmi?')) return;
  await api('/users/' + id, { method: 'PATCH', body: { blocked } }); toast(blocked ? 'Bloklandi' : 'Blokdan chiqarildi'); loadUsers();
}
async function deleteUser(id) {
  if (!confirm('Foydalanuvchi va uning BARCHA guruh, talaba va davomat ma\'lumotlari o\'chiriladi. Bu qaytarilmaydi. Davom etasizmi?')) return;
  await api('/users/' + id, { method: 'DELETE' }); toast('O\'chirildi'); loadUsers();
}

// ---------- Guruhlar ----------
async function loadGroups() {
  const { groups, defaultChannel } = await api('/groups');
  $('tab-groups').innerHTML = `<h2 class="font-semibold mb-3">Guruhlar (${groups.length})</h2>` + tableWrap(th('Guruh', 'Starosta (egasi)', 'Talaba', 'Davomat', 'Oxirgi davomat', 'Ustozlar', 'Telegram kanal') + `<tbody class="divide-y divide-slate-100">${groups.map(g => `
    <tr>
      <td class="px-4 py-2.5"><div class="font-medium">${esc(g.name)}</div><div class="text-xs text-slate-400">${esc(g.faculty)}</div></td>
      <td class="px-4 py-2.5"><div>${esc(g.owner)}</div><div class="text-xs text-slate-400">${esc(g.email)}</div></td>
      <td class="px-4 py-2.5">${g.students}</td>
      <td class="px-4 py-2.5 font-semibold ${g.rate !== null && g.rate < 70 ? 'text-rose-600' : ''}">${g.rate === null ? '—' : g.rate + '%'}</td>
      <td class="px-4 py-2.5 text-xs">${esc(g.lastAttendance || '—')}</td>
      <td class="px-4 py-2.5">${g.teachers}</td>
      <td class="px-4 py-2.5"><div class="flex gap-1.5">
        <input id="ch-${esc(g.id)}" value="${esc(g.channelId || '')}" placeholder="${esc(defaultChannel || 'standart yo\'q')}" class="w-40 border border-slate-300 rounded-lg px-2 py-1 text-xs">
        <button onclick="saveChannel('${esc(g.id)}')" class="px-2 py-1 rounded-lg bg-slate-900 text-white text-xs font-semibold">Saqlash</button></div></td>
    </tr>`).join('')}</tbody>`) +
    `<p class="mt-3 text-xs text-slate-400">Kanal maydoni bo'sh bo'lsa, umumiy kanal (.env dagi TELEGRAM_CHANNEL_ID) ishlatiladi. Bot ko'rsatilgan kanalda admin bo'lishi shart.</p>`;
}
async function saveChannel(id) {
  await api(`/groups/${id}/telegram`, { method: 'PUT', body: { channel_id: $('ch-' + id).value } }); toast('Kanal saqlandi');
}

// ---------- Telegram ----------
async function loadTelegram() {
  const [t, { log }] = await Promise.all([api('/telegram'), api('/telegram/log')]);
  let status;
  if (!t.enabled) status = `<p class="text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded-xl p-3">Bot sozlanmagan. <code>.env</code> fayliga <code>TELEGRAM_BOT_TOKEN</code> va <code>TELEGRAM_CHANNEL_ID</code> ni kiriting va serverni qayta ishga tushiring.</p>`;
  else status = `
    <div class="grid sm:grid-cols-2 gap-3 text-sm">
      <div class="rounded-xl bg-slate-50 p-3"><div class="text-xs text-slate-500">Bot</div><div class="font-semibold">${t.bot ? '@' + esc(t.bot.username) : '<span class="text-rose-600">' + esc(t.error || 'ulanmadi') + '</span>'}</div></div>
      <div class="rounded-xl bg-slate-50 p-3"><div class="text-xs text-slate-500">Umumiy kanal</div>
        <div class="font-semibold">${t.defaultChannel ? esc(t.defaultChannel) : '<span class="text-slate-400">sozlanmagan</span>'}</div>
        ${t.channel ? (t.channel.ok ? `<div class="text-xs mt-0.5 ${t.channel.canPost ? 'text-emerald-600' : 'text-rose-600'}">${esc(t.channel.title)} · bot: ${esc(t.channel.botStatus)} · ${t.channel.canPost ? 'xabar yubora oladi ✓' : 'xabar yuborish huquqi YO\'Q'}</div>` : `<div class="text-xs mt-0.5 text-rose-600">${esc(t.channel.error)}</div>`) : ''}
      </div>
    </div>
    <div class="mt-3 flex flex-wrap gap-2">
      <input id="test-chat" placeholder="Test uchun chat ID (bo'sh = umumiy kanal)" class="flex-1 min-w-48 border border-slate-300 rounded-xl px-3 py-2 text-sm">
      <button onclick="testTelegram()" class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-sm font-semibold">Test xabar yuborish</button>
    </div>`;
  $('tab-telegram').innerHTML = `
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/70"><h2 class="font-semibold mb-3">Telegram bot holati</h2>${status}</div>
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/70"><h2 class="font-semibold mb-3">So'nggi yuborishlar</h2>
      ${log.length ? tableWrap(th('Vaqt', 'Guruh', 'Kimga', 'Natija') + `<tbody class="divide-y divide-slate-100">${log.map(l => `
        <tr><td class="px-4 py-2 text-xs whitespace-nowrap">${fmtDT(l.createdAt)}</td><td class="px-4 py-2">${esc(l.groupName || '—')}</td>
        <td class="px-4 py-2 text-xs">${{ channel: 'Kanal', teacher: 'Ustoz', test: 'Test' }[l.target]} <span class="text-slate-400">${esc(l.chatId)}</span></td>
        <td class="px-4 py-2 text-xs font-medium ${l.ok ? 'text-emerald-600' : 'text-rose-600'}">${l.ok ? esc(l.info) : esc(l.info)}</td></tr>`).join('')}</tbody>`) : '<p class="text-sm text-slate-400">Hali yuborilmagan</p>'}
    </div>
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/70 text-sm text-slate-600 space-y-1.5">
      <h2 class="font-semibold text-slate-800">Sozlash tartibi</h2>
      <p>1. @BotFather orqali bot yarating, tokenni <code>TELEGRAM_BOT_TOKEN</code> ga yozing.</p>
      <p>2. Kanal yarating → Administratorlar → botni qo'shing (<b>xabar yuborish</b> huquqi bilan).</p>
      <p>3. Kanal ID sini (<code>@kanal_nomi</code> yoki <code>-100…</code>) <code>TELEGRAM_CHANNEL_ID</code> ga yozing.</p>
      <p>4. Starosta "Sozlamalar" bo'limidan ustoz uchun havola oladi; ustoz havolani ochib botda <b>Start</b> bosadi.</p>
    </div>`;
}
